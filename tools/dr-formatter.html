<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain + DR Formatter | LinkXcel</title>
<meta name="description" content="Paste lines like https://example.com 45 and get database-ready lines like example.com: 45, for building a DR database.">
<style>
.tool-body{max-width:900px;margin:24px auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55;box-sizing:border-box}
.tool-body *{box-sizing:border-box}
.tool-body .backlink{display:inline-block;margin-bottom:16px;font-weight:700;color:#2563eb;text-decoration:none}
.tool-body h1{margin:0 0 8px;font-size:26px;color:#0f172a}
.tool-body h2{margin:24px 0 8px;font-size:19px;color:#0f172a}
.tool-body h3{margin:16px 0 8px;font-size:16px;color:#0f172a}
.tool-body p,.tool-body label,.tool-body li,.tool-body td,.tool-body th{color:#0f172a}
.tool-body .desc{color:#334155;margin:0 0 12px}
.tool-body .note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;color:#92400e;margin:12px 0}
.tool-body .warn{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;color:#991b1b;margin:12px 0}
.tool-body .ok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 12px;color:#166534;margin:12px 0}
.tool-body textarea,.tool-body input[type="text"],.tool-body input[type="number"],.tool-body select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:#fff;color:#0f172a}
.tool-body textarea{min-height:150px;resize:vertical}
.tool-body input[type="file"]{width:100%;padding:8px}
.tool-body .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.tool-body .row>*{flex:1 1 200px}
.tool-body .row .narrow{flex:0 1 140px}
.tool-body button,.tool-body .btn{padding:10px 18px;border:0;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;color:#fff;background:#0891b2}
.tool-body button:hover,.tool-body .btn:hover{filter:brightness(1.08)}
.tool-body .btn-sec{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
.tool-body .btn-sec:hover{background:#f1f5f9}
.tool-body .tblwrap{overflow-x:auto;margin-top:16px}
.tool-body table{width:100%;border-collapse:collapse;min-width:480px}
.tool-body th,.tool-body td{border:1px solid #e2e8f0;padding:9px;text-align:left;vertical-align:top;word-break:break-word}
.tool-body th{background:#f1f5f9}
.tool-body tr.found,.tool-body tr.pass{background:#dcfce7}
.tool-body tr.notfound,.tool-body tr.fail{background:#fee2e2}
.tool-body .highlight{background:#dcfce7;padding:6px 8px;border-radius:6px;margin:4px 0;word-break:break-all}
.tool-body .diff{background:#fee2e2;padding:6px 8px;border-radius:6px;margin:4px 0;word-break:break-all}
.tool-body .stats{font-weight:700;margin:12px 0}
.tool-body canvas{max-width:100%;border:1px solid #e2e8f0;border-radius:8px}
.tool-body .two-col{display:flex;gap:12px;flex-wrap:wrap}
.tool-body .two-col>*{flex:1 1 320px}
@media (max-width:600px){.tool-body{margin:12px;padding:16px}.tool-body h1{font-size:22px}}
</style>
</head>
<body style="margin:0;background:#f1f5f9">
<div class="tool-body">
<a class="backlink" href="../index.html">&larr; All Tools</a>
<h1>Domain + DR Formatter</h1>
<p class="desc">Paste lines like https://example.com 45 and get database-ready lines like example.com: 45, for building a DR database.</p>
<p class="note">Honest note: this is a formatter only. It does NOT check or measure DR — it only reformats lines you already have into database lines.</p>
<div class="two-col"><div><label for="input">Input (URL + DR per line, e.g. https://example.com 45)</label><textarea id="input" placeholder="https://example.com 45&#10;https://google.com 95"></textarea></div><div><label for="output">Output</label><textarea id="output" readonly placeholder="&quot;example.com&quot;: 45,"></textarea></div></div>
<div class="row"><button type="button" id="genBtn">Format DR List</button></div>
</div>
<script>
function extractDomain(url) {
  try {
    url = url.trim();
    if (url.indexOf("http") !== 0) url = "http://" + url;
    return new URL(url).hostname.replace(/^www\./, "");
  } catch (e) { return ""; }
}
document.getElementById("genBtn").addEventListener("click", function () {
  var out = [];
  document.getElementById("input").value.split("\n").forEach(function (line) {
    line = line.trim();
    if (!line) return;
    var parts = line.split(/\s+/);
    if (parts.length >= 2) {
      var domain = extractDomain(parts[0]);
      var dr = parts[1];
      if (domain && !isNaN(dr)) out.push('"' + domain + '": ' + dr + ",");
    }
  });
  document.getElementById("output").value = out.join("\n");
});
</script>
</body>
</html>
